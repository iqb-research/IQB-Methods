on:
  workflow_dispatch:
  push:
    branches: main
  pull_request:
    branches: main
    types: [opened, reopened, synchronize, closed]

name: Quarto Publish

concurrency:
  group: quarto-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: https://iqb-research.github.io/IQB-Methods

jobs:
  build-deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libgsl-dev \
            libmagick++-dev \
            libglpk-dev \
            libnode-dev \
            libpoppler-cpp-dev

      - name: Check out repository
        uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv

      - uses: r-lib/actions/setup-renv@v2
        with:
          # Rebuild the cache after the stringfish/qs2/RcppParallel ABI mismatch.
          cache-version: 3

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            printf 'website:\n  site-url: "%s/pr-preview/pr-%s/"\n' "$SITE_URL" "$PR_NUMBER" > _quarto-preview.yml
            quarto render --profile preview
          else
            quarto render
          fi
          touch _site/.nojekyll

      - name: Save rendered website
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: _site
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build-deploy
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    environment:
      name: ${{ github.event_name == 'pull_request' && format('pr-preview-{0}', github.event.number) || 'github-pages' }}
      url: ${{ steps.preview.outputs.preview-url || 'https://iqb-research.github.io/IQB-Methods/' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: website
          path: _site

      - name: Publish website
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean-exclude: pr-preview/
          force: false

      - name: Publish PR preview
        id: preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          comment: false
          qr-code: false

      # Pushes made with GITHUB_TOKEN do not trigger a Pages build automatically.
      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

      - name: Link to PR preview
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        run: printf '[Open PR preview](%s)\n' "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

  remove-preview:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4

      - name: Remove closed PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
          comment: false
          qr-code: false

      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
