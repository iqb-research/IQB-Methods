on:
  workflow_dispatch:
  push:
    branches: main
  pull_request:
    branches: main
    types: [opened, reopened, synchronize, closed]

name: Quarto Publish

concurrency:
  group: quarto-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: https://iqb-research.github.io/IQB-Methods

jobs:
  build-deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libgsl-dev \
            libmagick++-dev \
            libglpk-dev \
            libnode-dev \
            libpoppler-cpp-dev

      - name: Check out repository
        uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv

      - uses: r-lib/actions/setup-renv@v2
        with:
          # Rebuild the cache after the stringfish/qs2/RcppParallel ABI mismatch.
          cache-version: 3

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            printf 'website:\n  site-url: "%s/pr-preview/pr-%s/"\n' "$SITE_URL" "$PR_NUMBER" > _quarto-preview.yml
            quarto render --profile preview
          else
            quarto render
          fi
          touch _site/.nojekyll

      - name: Save rendered website
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: _site
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build-deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    # Only GitHub's final Pages deployment uses an environment (github-pages).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: website
          path: _site

      - name: Publish website
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean-exclude: pr-preview/
          force: false

      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

  preview:
    needs: build-deploy
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      statuses: write
    # A commit status provides the PR link without creating an environment.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: website
          path: _site

      - name: Publish PR preview
        id: preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          comment: false
          qr-code: false

      # Pushes made with GITHUB_TOKEN do not trigger a Pages build automatically.
      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

      - name: Link to PR preview
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        run: printf '[Open PR preview](%s)\n' "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Add preview link to PR checks
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.pull_request.head.sha,
              context: 'PR preview',
              state: 'success',
              description: 'Open the online preview',
              target_url: process.env.PREVIEW_URL
            });

  remove-preview:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      deployments: write
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - name: Remove closed PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
          comment: false
          qr-code: false

      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

      - name: Remove closed PR deployment entries
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            if (!pr || pr.state !== 'closed' ||
                pr.head.repo?.full_name !== `${owner}/${repo}`) {
              throw new Error('Deployment cleanup requires a closed PR from this repository.');
            }
            const environment = `pr-preview-${pr.number}`;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner, repo, environment, per_page: 100
            });
            for (const deployment of deployments) {
              if (deployment.environment !== environment) {
                throw new Error(`Unexpected deployment environment: ${deployment.environment}`);
              }
            }
            for (const deployment of deployments) {
              const target = { owner, repo, deployment_id: deployment.id };
              await github.rest.repos.createDeploymentStatus({
                ...target, state: 'inactive', auto_inactive: false
              });
              await github.rest.repos.deleteDeployment(target);
            }
            core.info(`Removed ${deployments.length} deployment entries for ${environment}.`);

      - name: Retire preview link in PR checks
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.pull_request.head.sha,
              context: 'PR preview',
              state: 'success',
              description: 'Preview removed because this PR is closed',
              target_url: context.payload.pull_request.html_url
            });
